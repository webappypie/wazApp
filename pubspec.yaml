name: wazapp
description: "WazApp - Save. Style. Share."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^3.4.3

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Database ---
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- Logging ---
  logging: ^1.3.0

  # --- Utilities ---
  equatable: ^2.0.7
  shared_preferences: ^2.3.3  # onboarding flag and theme choice only
  video_player: ^2.14.1
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  image: ^4.12.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Code generation ---
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  # --- Testing ---
  mocktail: ^1.0.4
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  # Bundled OFL fonts. Every family covers Devanagari (Hindi) and Latin, except Pacifico
  # (Latin only; Hindi text falls back to Hind). See assets/fonts/README.md.
  fonts:
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
    - family: TiroDevanagariHindi
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: RozhaOne
      fonts:
        - asset: assets/fonts/RozhaOne-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
