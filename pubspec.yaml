name: wapptidy
description: "WappTidy — Media Cleaner & Organizer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Database ---
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- Logging ---
  logging: ^1.3.0

  # --- Firebase (optional, fail-safe) ---
  firebase_core: ^3.8.0
  firebase_remote_config: ^5.3.0

  # --- Utilities ---
  equatable: ^2.0.7
  shared_preferences: ^2.3.3  # onboarding-seen flag, lightweight KV only
  permission_handler: ^12.0.0  # Android runtime permissions (READ_MEDIA_*, etc.)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Code generation ---
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9

  # --- Testing ---
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
