name: wazapp
description: "WazApp - Save. Style. Share."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^3.4.3

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Database ---
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- Logging ---
  logging: ^1.3.0

  # --- Utilities ---
  equatable: ^2.0.7
  shared_preferences: ^2.3.3  # onboarding flag and theme choice only
  video_player: ^2.14.1
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  image: ^4.12.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  http: ^1.6.0
  url_launcher: ^6.3.3
  permission_handler: ^12.0.1  # notification permission state + request (Android 13+/iOS)

  # --- WAPCentral (integration guide sections 5, 8, 10) ---
  # Path packages: the SDKs are not published on pub.dev; they live in the sibling WAPCentral checkout.
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  google_mobile_ads: ^9.1.0   # Google AdMob, the only ad SDK (direct, no mediation)
  visibility_detector: ^0.4.0+2  # counts an ad/promo impression only when it is really on screen
  wap_core_sdk:
    path: ../WAPCentral/sdks/wap_core_sdk
  wap_ads_sdk:
    path: ../WAPCentral/sdks/wap_ads_sdk
  wap_notifications_sdk:
    path: ../WAPCentral/sdks/wap_notifications_sdk
  wap_promo_sdk:
    path: ../WAPCentral/sdks/wap_promo_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Code generation ---
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  # --- Testing ---
  mocktail: ^1.0.4
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  # Bundled OFL fonts. Every family covers Devanagari (Hindi) and Latin, except Pacifico
  # (Latin only; Hindi text falls back to Hind). See assets/fonts/README.md.
  fonts:
    # UI fonts (same pair as the Clenzy reference): Sora for headlines/numbers, Plus Jakarta Sans for body.
    # Neither covers Devanagari; Hind is the fallback (see AppTheme).
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
    - family: TiroDevanagariHindi
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: RozhaOne
      fonts:
        - asset: assets/fonts/RozhaOne-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
